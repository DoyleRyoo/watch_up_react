server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        # Compose는 정적 파일과 무관한 이 경로로 React 이미지의 준비 상태를 확인한다.
        access_log off;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store";
        return 200 "healthy\n";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        # Vite 해시 파일만 장기 캐시하며, 없는 asset을 SPA HTML로 숨기지 않는다.
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|map|json|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2)$ {
        try_files $uri =404;
    }

    # /login과 /auth/callback 같은 client route는 React Router가 해석한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;
}